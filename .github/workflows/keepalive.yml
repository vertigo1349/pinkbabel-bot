name: Keep PinkBabel awake

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  touch-health:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Render and Supabase
        run: |
          response="$(curl --fail --show-error --location --max-time 60 "https://pinkbabel-bot.onrender.com/health?touch=db")"
          echo "$response"
          case "$response" in
            *'"database":"ok"'*) ;;
            *) echo "Expected database keepalive to return database=ok"; exit 1 ;;
          esac
